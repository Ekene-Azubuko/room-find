services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-room_find}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-room_find}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-room_find}
      POSTGRES_USER: ${POSTGRES_USER:-room_find}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
