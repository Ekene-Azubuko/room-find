services:
  frontend:
    image: python:3.12-slim
    working_dir: /frontend
    command: ["python", "-m", "http.server", "3000", "--bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/frontend:ro

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend:/app

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-room_find}
      POSTGRES_USER: ${POSTGRES_USER:-room_find}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
