# Dedicated disposable database; never mounts the development PostgreSQL volume.
services:
  test-db:
    image: postgres:17
    environment:
      POSTGRES_DB: room_find_test
      POSTGRES_USER: room_find_test
      POSTGRES_PASSWORD: test-only-password
    ports:
      - '127.0.0.1:55439:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U room_find_test -d room_find_test']
      interval: 2s
      timeout: 3s
      retries: 20
